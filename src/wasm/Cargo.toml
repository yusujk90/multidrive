[package]
name = "omnidrive-wasm-crypto"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust WASM module for SHA-256 streaming hashing and AES-256-GCM client-side encryption for OmniDrive"
authors = ["OmniDrive Core Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["aes"] }
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
